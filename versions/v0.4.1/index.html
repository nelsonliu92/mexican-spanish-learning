<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#006847">
<title>🇲🇽 墨西哥西語學習</title>
<style>
:root {
  --mx-green:#006847; --mx-red:#CE1126; --bg-warm:#FDF8F0; --bg-card:#FFFFFF;
  --text-main:#2D2D2D; --text-sub:#6B6B6B; --accent:#E67E22;
  --success:#27AE60; --border:#E8E0D5; --locked:#C0B8AD;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans TC",sans-serif;background:var(--bg-warm);color:var(--text-main);line-height:1.6;min-height:100vh;padding-bottom:40px}
.header{background:var(--mx-green);color:#fff;padding:16px 20px 14px;box-shadow:0 2px 6px rgba(0,0,0,.15);position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header-title{font-size:18px;font-weight:700;letter-spacing:.3px}
.header-sub{font-size:13px;opacity:.85;margin-top:2px}
.welcome{padding:16px 20px 8px;font-size:15px;color:var(--text-sub)}
.welcome strong{color:var(--mx-green)}
.week-list{display:flex;flex-direction:column;gap:14px;padding:10px 16px 20px}
.week-card{background:var(--bg-card);border-radius:18px;padding:18px 20px;box-shadow:0 2px 8px rgba(0,0,0,.08);cursor:pointer;transition:transform .15s,border-color .2s;border:2px solid transparent}
.week-card:active{transform:scale(.98)}
.week-card:hover,.week-card:focus{border-color:var(--mx-green)}
.week-card.locked{cursor:default;opacity:.65}
.week-card.locked:active{transform:none}
.week-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.week-title{font-size:18px;font-weight:700;color:var(--mx-green)}
.week-status{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:var(--border);color:#fff}
.week-status.done{background:var(--success)}
.week-status.progress{background:var(--accent)}
.week-days{display:flex;flex-direction:column;gap:6px}
.day-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--text-sub);padding:4px 0;cursor:pointer;border-radius:8px;transition:background .15s}
.day-row:active{background:rgba(0,104,71,.08)}
.day-row .day-num{flex-shrink:0;width:48px;font-weight:600;color:var(--text-main)}
.day-row .day-theme{flex:1}
.day-row .day-check{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.day-row.done .day-check{background:var(--success);color:#fff}
.day-row.pending .day-check{border:2px solid var(--border);background:transparent}
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-top:12px;overflow:hidden}
.progress-fill{height:100%;background:var(--mx-green);border-radius:3px;transition:width .4s ease}
.footer{text-align:center;padding:20px;font-size:12px;color:#B0A99F}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.week-card{animation:fadeIn .4s ease}
</style>
</head>
<body>
<div class="header">
  <div class="header-top">
    <div>
      <div class="header-title">🇲🇽 墨西哥西班牙語學習</div>
      <div class="header-sub">每週 7 天 · 從零開始學墨西哥西語</div>
    </div>
  </div>
</div>

<div class="welcome">選擇一週開始學習 👇</div>

<div class="week-list" id="week-list">
  <!-- JS 產生 -->
</div>

<div class="footer">墨西哥語學習 App · MVP v0.4 · 離線可用</div>

<script>
const WEEKS=[
  {
    id:1,title:"第一週",file:"week1.html",
    days:["問候語","自我介紹","購物問價","餐廳點餐","問路與交通","工作場景","日常閒聊與道別"]
  },
  {
    id:2,title:"第二週",file:"week2.html",
    days:["即將推出","即將推出","即將推出","即將推出","即將推出","即將推出","即將推出"],
    locked:true
  },
  {
    id:3,title:"第三週",file:"week3.html",
    days:["即將推出","即將推出","即將推出","即將推出","即將推出","即將推出","即將推出"],
    locked:true
  }
];

function init(){
  var week1Progress=loadWeek1Progress();
  var container=document.getElementById('week-list');
  container.innerHTML=WEEKS.map(function(w,wi){
    var completed=0;
    var dayRows='';
    if(!w.locked && week1Progress){
      completed=week1Progress.completed?week1Progress.completed.length:0;
    }
    dayRows=w.days.map(function(d,di){
      var isDone=(!w.locked && week1Progress && week1Progress.completed && week1Progress.completed.includes(di+1));
      return '<div class="day-row '+(isDone?'done':'pending')+'" onclick="event.stopPropagation();goDay(\''+w.file+'\','+(di+1)+')">'+
        '<span class="day-num">Day '+(di+1)+'</span>'+
        '<span class="day-theme">'+esc(d)+'</span>'+
        '<span class="day-check">'+(isDone?'✓':'')+'</span>'+
      '</div>';
    }).join('');

    var statusText,statusClass;
    if(w.locked){statusText='即將推出';statusClass='';}
    else if(completed===7){statusText='已完成';statusClass='done';}
    else if(completed>0){statusText='進行中 '+completed+'/7';statusClass='progress';}
    else{statusText='尚未開始';statusClass='';}

    var progressPct=w.locked?0:Math.round((completed/7)*100);

    return '<div class="week-card '+(w.locked?'locked':'')+'" '+(w.locked?'':'onclick="go(\''+w.file+'\')"')+'>'+
      '<div class="week-header">'+
        '<div class="week-title">'+esc(w.title)+'</div>'+
        '<div class="week-status '+statusClass+'">'+statusText+'</div>'+
      '</div>'+
      '<div class="week-days">'+dayRows+'</div>'+
      '<div class="progress-bar"><div class="progress-fill" style="width:'+progressPct+'%"></div></div>'+
    '</div>';
  }).join('');
}

function loadWeek1Progress(){
  try{
    var d=localStorage.getItem('mx_lesson_progress_v1');
    if(d)return JSON.parse(d);
  }catch(e){}
  return null;
}

function go(file){window.location.href=file;}
function goDay(file,day){window.location.href=file+'?day='+day;}
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

init();
</script>
</body>
</html>
